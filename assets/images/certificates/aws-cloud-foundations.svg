<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040814"/>
      <stop offset="50%" stop-color="#091326"/>
      <stop offset="100%" stop-color="#030610"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#00ff9d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="url(#bgGrad)" rx="16"/>
  
  <!-- Outer Gold/Cyan Border -->
  <rect x="24" y="24" width="852" height="552" fill="none" stroke="url(#borderGrad)" stroke-width="2" rx="10"/>
  <rect x="34" y="34" width="832" height="532" fill="none" stroke="#00f0ff" stroke-opacity="0.15" stroke-dasharray="6,4" rx="8"/>

  <!-- Corner Accents -->
  <path d="M 24 60 L 60 24 M 24 70 L 70 24" stroke="#00f0ff" stroke-width="1.5" opacity="0.6"/>
  <path d="M 876 60 L 840 24 M 876 70 L 830 24" stroke="#00f0ff" stroke-width="1.5" opacity="0.6"/>
  <path d="M 24 540 L 60 576 M 24 530 L 70 576" stroke="#00f0ff" stroke-width="1.5" opacity="0.6"/>
  <path d="M 876 540 L 840 576 M 876 530 L 830 576" stroke="#00f0ff" stroke-width="1.5" opacity="0.6"/>

  <!-- Issuer Logo / Badge -->
  <g transform="translate(450, 110)">
    <circle r="42" fill="#0c1a36" stroke="#00f0ff" stroke-width="2" filter="url(#glow)"/>
    <circle r="36" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,2"/>
    <path d="M -16 6 C -16 -4, -6 -12, 4 -10 C 8 -16, 20 -14, 22 -6 C 26 -6, 28 -2, 28 2 C 28 6, 24 10, 18 10 L -12 10 C -16 10, -16 6, -16 6 Z" fill="url(#goldGrad)"/>
    <text y="4" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#030712" text-anchor="middle">AWS</text>
  </g>

  <!-- Certificate Subheader -->
  <text x="450" y="195" font-family="'Fira Code', monospace" font-size="14" letter-spacing="4" fill="#00f0ff" text-anchor="middle" text-transform="uppercase">Certificate of Completion</text>
  
  <!-- Presentation Line -->
  <text x="450" y="235" font-family="'Inter', sans-serif" font-size="15" fill="#8494ab" text-anchor="middle">This is to certify that</text>

  <!-- Recipient Name -->
  <text x="450" y="285" font-family="'Playfair Display', serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">Deevyanshu Sahu</text>
  <line x1="280" y1="305" x2="620" y2="305" stroke="url(#goldGrad)" stroke-width="1.5"/>

  <!-- Accomplishment Text -->
  <text x="450" y="340" font-family="'Inter', sans-serif" font-size="15" fill="#8494ab" text-anchor="middle">has successfully fulfilled the curriculum and demonstrated foundational cloud competency in</text>

  <!-- Course Title -->
  <text x="450" y="385" font-family="'Inter', sans-serif" font-size="24" font-weight="700" fill="#00f0ff" text-anchor="middle">AWS Academy Graduate — Cloud Foundations</text>

  <!-- Issuer Name -->
  <text x="450" y="420" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#a5f3fc" text-anchor="middle">Amazon Web Services Training &amp; Certification</text>

  <!-- Bottom Row -->
  <g transform="translate(160, 490)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="#334155" stroke-width="1"/>
    <text x="80" y="18" font-family="'Inter', sans-serif" font-size="12" fill="#8494ab" text-anchor="middle">Date of Issue: Feb 2026</text>
  </g>

  <g transform="translate(450, 490)">
    <polygon points="0,-18 16,-6 16,12 0,22 -16,12 -16,-6" fill="none" stroke="#00ff9d" stroke-width="1.5"/>
    <circle r="4" fill="#00ff9d"/>
    <text x="0" y="38" font-family="'Fira Code', monospace" font-size="10" fill="#00ff9d" text-anchor="middle" letter-spacing="1">VERIFIED CREDENTIAL</text>
  </g>

  <g transform="translate(580, 490)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="#334155" stroke-width="1"/>
    <text x="80" y="18" font-family="'Inter', sans-serif" font-size="12" fill="#8494ab" text-anchor="middle">AWS Academy Program</text>
  </g>
</svg>
