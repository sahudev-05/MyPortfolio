<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04091a"/>
      <stop offset="50%" stop-color="#0b1733"/>
      <stop offset="100%" stop-color="#030612"/>
    </linearGradient>
    <linearGradient id="goldGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="borderGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#bgGrad4)" rx="16"/>
  <rect x="24" y="24" width="852" height="552" fill="none" stroke="url(#borderGrad4)" stroke-width="2" rx="10"/>
  <rect x="34" y="34" width="832" height="532" fill="none" stroke="#00f0ff" stroke-opacity="0.15" stroke-dasharray="6,4" rx="8"/>

  <g transform="translate(450, 110)">
    <circle r="42" fill="#0d1f3d" stroke="#00f0ff" stroke-width="2"/>
    <circle r="36" fill="none" stroke="#67e8f9" stroke-width="1" stroke-dasharray="3,2"/>
    <text y="7" font-family="'Fira Code', monospace" font-size="20" font-weight="bold" fill="url(#goldGrad4)" text-anchor="middle">&lt;C++&gt;</text>
  </g>

  <text x="450" y="195" font-family="'Fira Code', monospace" font-size="14" letter-spacing="4" fill="#00f0ff" text-anchor="middle" text-transform="uppercase">Coursera Specialization Certificate</text>
  <text x="450" y="235" font-family="'Inter', sans-serif" font-size="15" fill="#8494ab" text-anchor="middle">This is to certify that</text>
  <text x="450" y="285" font-family="'Playfair Display', serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">Deevyanshu Sahu</text>
  <line x1="280" y1="305" x2="620" y2="305" stroke="url(#goldGrad4)" stroke-width="1.5"/>

  <text x="450" y="340" font-family="'Inter', sans-serif" font-size="15" fill="#8494ab" text-anchor="middle">has successfully mastered advanced algorithmic problem solving and data structures in</text>
  <text x="450" y="385" font-family="'Inter', sans-serif" font-size="24" font-weight="700" fill="#00f0ff" text-anchor="middle">C++ and Data Structures in the STL</text>
  <text x="450" y="420" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#a5f3fc" text-anchor="middle">Coursera Online Learning</text>

  <g transform="translate(160, 490)">
