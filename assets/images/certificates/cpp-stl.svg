    <text x="0" y="38" font-family="'Fira Code', monospace" font-size="10" fill="#00f0ff" text-anchor="middle" letter-spacing="1">SPECIALIZATION COMPLETE</text>
  </g>
  <g transform="translate(580, 490)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="#334155" stroke-width="1"/>
    <text x="80" y="18" font-family="'Inter', sans-serif" font-size="12" fill="#8494ab" text-anchor="middle">Coursera Verification ID</text>
